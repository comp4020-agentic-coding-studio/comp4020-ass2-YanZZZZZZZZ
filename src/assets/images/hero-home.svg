<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
  <rect width="1600" height="700" fill="#EFE6D8" />

  <!-- ruined colonnade, alternating near/far arches for depth without a second ink -->
  <path d="M30,700 L30,260 L100,150 L170,260 L170,700 Z" fill="#201C18" />
  <path d="M230,700 L230,360 L300,280 L370,360 L370,700 Z" fill="#201C18" opacity="0.35" />
  <path d="M430,700 L430,260 L500,150 L570,260 L570,700 Z" fill="#201C18" />
  <path d="M630,700 L630,360 L700,280 L770,360 L770,700 Z" fill="#201C18" opacity="0.35" />
  <path d="M830,700 L830,260 L900,150 L970,260 L970,700 Z" fill="#201C18" />
  <path d="M1430,700 L1430,360 L1500,280 L1570,360 L1570,700 Z" fill="#201C18" opacity="0.35" />

  <!-- sword planted in the ground, clear of the arches: the genre's own icon for a checkpoint -->
  <circle cx="1200" cy="366" r="17" fill="#201C18" />
  <rect x="1192" y="372" width="16" height="58" fill="#201C18" />
  <rect x="1145" y="424" width="110" height="14" rx="3" fill="#201C18" />
  <path d="M1187,430 L1213,430 L1200,640 Z" fill="#201C18" />

  <!-- wreathing flame, on top of the blade's tip -->
  <g transform="translate(1020,412) scale(3.6)">
    <path
      d="M50,30 C41,41 39,52 46,59 C41,55 39,61 44,68 C39,66 42,75 50,80 C58,75 61,66 56,68 C61,61 59,55 54,59 C61,52 59,41 50,30 Z"
      fill="#B97D1C"
    />
  </g>
</svg>
